apiVersion: apps/v1
kind: Deployment
metadata: { name: sapwms-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: sapwms-api } }
  template:
    metadata: { labels: { app: sapwms-api } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: ghcr.io/curiousminds-dev/student-management-api:latest
          ports: [{ containerPort: 3001 }]
          envFrom: [{ configMapRef: { name: sapwms-api } }, { secretRef: { name: sapwms-api } }]
          readinessProbe:
            {
              httpGet: { path: /health/ready, port: 3001 },
              initialDelaySeconds: 10,
              periodSeconds: 10,
            }
          livenessProbe:
            {
              httpGet: { path: /health/live, port: 3001 },
              initialDelaySeconds: 20,
              periodSeconds: 20,
            }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 1, memory: 1Gi } }
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
---
apiVersion: v1
kind: Service
metadata: { name: sapwms-api }
spec: { selector: { app: sapwms-api }, ports: [{ port: 80, targetPort: 3001 }] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: sapwms-api }
spec: { minAvailable: 1, selector: { matchLabels: { app: sapwms-api } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: sapwms-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: sapwms-api }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    [
      {
        type: Resource,
        resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } },
      },
    ]
